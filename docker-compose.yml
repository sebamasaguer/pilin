version: '3.8'

services:
  app:
    build: .
    container_name: telegram_bot_app
    restart: unless-stopped
    env_file: .env # Usaremos un archivo .env para las variables de entorno
    environment:
      - NODE_ENV=development # O production, según sea necesario
    volumes:
      - .:/usr/src/app # Montar el código local para desarrollo en caliente
      - /usr/src/app/node_modules # Evitar que node_modules local sobrescriba el del contenedor
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file: .env # Usaremos un archivo .env para las credenciales de la BD
    ports:
      - "5432:5432" # Exponer el puerto de PostgreSQL al host (opcional, para acceso directo)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
